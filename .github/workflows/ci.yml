name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/workia?sslmode=disable
      AUTH_SECRET: ci-auth-secret-with-at-least-32-characters

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      - run: npx playwright install --with-deps chromium

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run test

      - run: npm run build
